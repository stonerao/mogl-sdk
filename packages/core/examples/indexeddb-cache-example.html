<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndexedDB Cache Example - W3D SDK</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .container {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .viewer {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
        }

        #scene-container {
            width: 100%;
            height: 100%;
        }

        .controls {
            width: 320px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 20px;
            overflow-y: auto;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
        }

        .button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .button-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .button-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .button-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .button-secondary:hover {
            background: #e0e0e0;
        }

        .button-danger {
            background: #ff4757;
            color: white;
        }

        .button-danger:hover {
            background: #ee5a6f;
        }

        .stats {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            font-weight: 600;
            color: #333;
        }

        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .log-time {
            color: #858585;
        }

        .log-info {
            color: #4ec9b0;
        }

        .log-success {
            color: #6a9955;
        }

        .log-error {
            color: #f48771;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .checkbox-group input {
            margin-right: 8px;
        }

        .checkbox-group label {
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 IndexedDB Cache Example</h1>
        <p>Demonstrating persistent caching of 3D models and textures using IndexedDB</p>
    </div>

    <div class="container">
        <div class="viewer">
            <div id="scene-container"></div>
        </div>

        <div class="controls">
            <div class="control-group">
                <h3>📊 Cache Statistics</h3>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Cached Items:</span>
                        <span class="stat-value" id="cache-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Cache Size:</span>
                        <span class="stat-value" id="cache-size">0 MB</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Version:</span>
                        <span class="stat-value" id="cache-version">1</span>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <h3>🎮 Actions</h3>
                <button class="button button-primary" onclick="loadModel()">
                    Load Model
                </button>
                <button class="button button-secondary" onclick="updateStats()">
                    Refresh Stats
                </button>
                <button class="button button-danger" onclick="clearCache()">
                    Clear Cache
                </button>
            </div>

            <div class="control-group">
                <h3>⚙️ Settings</h3>
                <div class="checkbox-group">
                    <input type="checkbox" id="debug-mode" checked>
                    <label for="debug-mode">Debug Mode</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="cache-enabled" checked>
                    <label for="cache-enabled">Cache Enabled</label>
                </div>
            </div>

            <div class="control-group">
                <h3>📝 Console Log</h3>
                <div class="log" id="console-log">
                    <div class="log-entry log-info">
                        <span class="log-time">[00:00:00]</span> Ready to load models...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { Scene } from '@w3d/core';
        import { ModelLoader } from '@w3d/components';

        let scene = null;
        let loadCount = 0;

        // Initialize scene with IndexedDB cache
        async function initScene() {
            const debugMode = document.getElementById('debug-mode').checked;
            const cacheEnabled = document.getElementById('cache-enabled').checked;

            scene = new Scene('#scene-container', {
                renderer: {
                    antialias: true,
                    outputColorSpace: 'srgb'
                },
                camera: {
                    fov: 45,
                    position: [10, 8, 15],
                    lookAt: [0, 0, 0]
                },
                indexedDB: {
                    enabled: cacheEnabled,
                    dbName: 'W3DCache',
                    storeName: 'resources',
                    debug: debugMode,
                    version: 1
                }
            });

            scene.registerComponent('ModelLoader', ModelLoader);
            await scene.init();

            // Add lights
            scene.light.addAmbient({ color: '#ffffff', intensity: 0.6 });
            scene.light.addDirectional({
                color: '#ffffff',
                intensity: 1.0,
                position: [100, 100, 100]
            });

            addLog('Scene initialized successfully', 'success');
            await updateStats();
        }

        // Load model
        window.loadModel = async function() {
            if (!scene) {
                addLog('Please initialize scene first', 'error');
                return;
            }

            const startTime = performance.now();
            addLog('Loading model...', 'info');

            try {
                // Replace with your actual model URL
                const modelUrl = '/models/robot.glb';
                
                const model = await scene.add('ModelLoader', {
                    name: `model_${loadCount++}`,
                    url: modelUrl,
                    scale: 2,
                    position: [0, 0, 0]
                });

                const loadTime = (performance.now() - startTime).toFixed(2);
                addLog(`Model loaded in ${loadTime}ms`, 'success');
                
                await updateStats();
            } catch (error) {
                addLog(`Failed to load model: ${error.message}`, 'error');
            }
        };

        // Update cache statistics
        window.updateStats = async function() {
            if (!scene || !scene.indexedDBCache) {
                return;
            }

            try {
                const stats = await scene.indexedDBCache.getStats();
                document.getElementById('cache-count').textContent = stats.count;
                document.getElementById('cache-size').textContent = 
                    (stats.size / (1024 * 1024)).toFixed(2) + ' MB';
                
                addLog(`Cache stats updated: ${stats.count} items, ${(stats.size / 1024).toFixed(2)} KB`, 'info');
            } catch (error) {
                addLog(`Failed to get stats: ${error.message}`, 'error');
            }
        };

        // Clear cache
        window.clearCache = async function() {
            if (!scene || !scene.indexedDBCache) {
                addLog('Cache not available', 'error');
                return;
            }

            try {
                await scene.indexedDBCache.clear();
                addLog('Cache cleared successfully', 'success');
                await updateStats();
            } catch (error) {
                addLog(`Failed to clear cache: ${error.message}`, 'error');
            }
        };

        // Add log entry
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('console-log');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Initialize on load
        initScene();
    </script>
</body>
</html>
